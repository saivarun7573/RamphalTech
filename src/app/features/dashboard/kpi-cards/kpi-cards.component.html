<div class="kpi-grid">

  <div class="kpi-card total">
    <span>Total Flights</span>
    <h2>{{ totalFlights }}</h2>
  </div>

  <div class="kpi-card active">
    <span>Active Flights</span>
    <h2>{{ activeFlights }}</h2>
  </div>

  <div class="kpi-card delayed">
    <span>Delayed Flights</span>
    <h2>{{ delayedFlights }}</h2>
  </div>

  <div class="kpi-card arrived">
    <span>Arrived Flights</span>
    <h2>{{ arrivedFlights }}</h2>
  </div>

</div>
